# Adaptive One-way PR gate enforcement workflow
name: Enforce One-Way PR Gate
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches:
      - main

jobs:
  gate-check:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce dev -> main gate
        if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref != 'dev'
        run: |
          echo "::error::PR routing violation. Merges into target branch 'main' must originate from source branch 'dev'."
          exit 1
      - name: Gate passed
        run: echo "Branch pipeline trajectory validated successfully."
